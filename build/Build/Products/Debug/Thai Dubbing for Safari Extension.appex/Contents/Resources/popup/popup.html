<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Safari AI Thai Dubbing</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <!-- Header -->
    <header class="header">
      <div class="logo-area">
        <div class="logo-icon">🎙️</div>
        <div>
          <h1 class="title">Thai Video Dubber</h1>
          <p class="subtitle">AI พากย์ไทยสดบน YouTube</p>
        </div>
      </div>
      <div id="statusBadge" class="badge active">เปิดใช้งาน</div>
    </header>

    <!-- Master Toggle -->
    <div class="card toggle-card">
      <div class="toggle-info">
        <span class="label-primary">ระบบพากย์เสียงไทย</span>
        <span class="label-secondary">แปลซับและพากย์เสียงอัตโนมัติ</span>
      </div>
      <label class="switch">
        <input type="checkbox" id="enabledToggle" checked>
        <span class="slider"></span>
      </label>
    </div>

    <!-- Voice Selection -->
    <div class="card">
      <div class="form-group">
        <label for="voiceSelect" class="form-label">
          <span>🗣️ เสียงพากย์ AI</span>
        </label>
        <select id="voiceSelect" class="select-input">
          <option value="th-TH-PremwadeeNeural">👩 เปรมวดี (Premwadee - เสียงหญิง นุ่มนวล)</option>
          <option value="th-TH-NiwatNeural">👨 นิวัฒน์ (Niwat - เสียงชาย สุภาพ)</option>
        </select>
      </div>

      <div class="form-group" style="margin-top: 12px;">
        <label for="rateSelect" class="form-label">
          <span>⚡ ความเร็วเสียงพูด</span>
        </label>
        <select id="rateSelect" class="select-input">
          <option value="+0%">ปกติ (Normal)</option>
          <option value="+5%" selected>+5% (แนะนำ ทันซับพอดี)</option>
          <option value="+10%">+10% (กระชับ รวดเร็ว)</option>
          <option value="+15%">+15% (วิดีโอพูดเร็ว)</option>
        </select>
      </div>
    </div>

    <!-- Volume & Ducking Sliders -->
    <div class="card">
      <div class="slider-group">
        <div class="slider-header">
          <span class="form-label">🔊 ระดับเสียงพากย์</span>
          <span id="dubVolumeVal" class="slider-value">100%</span>
        </div>
        <input type="range" id="dubVolumeSlider" min="0" max="100" value="100" class="range-slider">
      </div>

      <div class="slider-group" style="margin-top: 14px;">
        <div class="slider-header">
          <span class="form-label">📉 ลดเสียงคลิปต้นฉบับ (Ducking)</span>
          <span id="duckVolumeVal" class="slider-value">20%</span>
        </div>
        <input type="range" id="duckVolumeSlider" min="0" max="50" value="20" class="range-slider">
        <span class="help-text">ลดเสียง YouTube เหลือ 20% ขณะพากย์</span>
      </div>
    </div>

    <!-- Server Connection & Settings -->
    <div class="card">
      <div class="form-group">
        <label for="backendUrl" class="form-label">
          <span>🌐 Backend Server URL</span>
        </label>
        <div class="input-with-button">
          <input type="text" id="backendUrl" class="text-input" placeholder="http://localhost:8000" value="http://localhost:8000">
          <button id="testBtn" class="btn-secondary" title="ทดสอบการเชื่อมต่อ">ตรวจสอบ</button>
        </div>
      </div>
      <div id="connResult" class="conn-status"></div>

      <details class="advanced-section">
        <summary class="advanced-toggle">⚙️ ตัวเลือกขั้นสูง (Gemini API Key)</summary>
        <div class="advanced-content">
          <div class="form-group">
            <label for="customKey" class="form-label">Custom Gemini API Key (ถ้าต้องการใส่แยก)</label>
            <input type="password" id="customKey" class="text-input" placeholder="AIzaSy...">
          </div>
        </div>
      </details>
    </div>

    <!-- Footer -->
    <footer class="footer">
      <span>Zero-Cost Stack • Gemini 2.0 & Edge-TTS</span>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
